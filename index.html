    <title>大學生消費行為研究 - 載入中</title>
    <script>
        window.onload = function() {
            // 請將引號內的網址替換為你們實際的 Google 表單連結
            const surveyForms = [
                "https://docs.google.com/forms/d/e/1FAIpQLSfvoa8HQIA9AIzh9Mkod3T-OCH2t0hYSZCUryowPI7CCOnoaA/viewform?usp=header",

            ];
            
            // 完全隨機抽取 0, 1, 2 其中一個索引值 (機率各 1/3)
            const randomIndex = Math.floor(Math.random() * surveyForms.length);
            
            // 執行自動重導向
            window.location.replace(surveyForms[randomIndex]);
        };
    </script>
